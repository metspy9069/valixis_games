<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road Riot 3D | VALIXIS Games</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: #070b13; }
    #game { width: 100vw; height: 100vh; display: block; }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: 18px; }
    .topbar { display: flex; justify-content: space-between; gap: 12px; }
    .panel { padding: 12px 16px; border: 1px solid rgba(125, 220, 255, .25); border-radius: 12px; background: rgba(4, 10, 20, .72); backdrop-filter: blur(8px); box-shadow: 0 0 24px rgba(0, 187, 255, .12); }
    .label { color: #7ddcff; font: 700 11px/1.2 ui-monospace, monospace; letter-spacing: 1.5px; }
    .value { font: 800 24px/1.1 ui-monospace, monospace; color: #fff; }
    #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 470px; pointer-events: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 72px); letter-spacing: -3px; color: #fff; text-shadow: 0 0 28px #00bfff; }
    p { margin: 8px 0 18px; color: #b6c8dc; line-height: 1.5; }
    button { border: 1px solid #65dcff; border-radius: 9px; padding: 12px 22px; color: #04111a; background: linear-gradient(135deg, #7dffe3, #57bfff); font-weight: 900; cursor: pointer; }
    button:hover { filter: brightness(1.15); }
    #hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: #b6c8dc; font: 700 12px ui-monospace, monospace; text-align: center; }
    .bar { width: 150px; height: 8px; overflow: hidden; margin-top: 6px; border-radius: 99px; background: #253343; }
    .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6d, #ffc857); transition: width .15s; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <a href="../" class="panel" style="text-decoration:none; color:#7ddcff; display:flex; align-items:center; gap:6px; font-weight:700; font-size:12px; pointer-events:auto; cursor:pointer;">&larr; ARCADE HUB</a>
      <div class="panel"><div class="label">DISTANCE</div><div class="value"><span id="distance">0</span>m</div></div>
      <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="panel"><div class="label">HULL</div><div class="bar"><i id="hull"></i></div></div>
    </div>
    <div id="status" class="panel">
      <h1>ROAD RIOT</h1>
      <p>Race through the neon wasteland, blast rival drivers, grab energy cells, and stay on the road.</p>
      <button id="start">START RUN</button>
    </div>
    <div id="hint">WASD / ARROWS: DRIVE &nbsp; SPACE: BOOST &nbsp; X: FIRE</div>
  </div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

    const canvas = document.querySelector('#game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x070b13, 30, 190);
    scene.background = new THREE.Color(0x070b13);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 260);
    camera.position.set(0, 7, 11);

    scene.add(new THREE.HemisphereLight(0x9bdcff, 0x111827, 1.8));
    const sun = new THREE.DirectionalLight(0xffc98b, 2.4);
    sun.position.set(-20, 32, 18); sun.castShadow = true; scene.add(sun);
    const neon = new THREE.PointLight(0x00bfff, 25, 50); neon.position.set(0, 4, -28); scene.add(neon);

    const roadWidth = 18, segmentLength = 12, segmentCount = 22;
    const segments = [], enemies = [], projectiles = [], pickups = [], particles = [];
    const keys = new Set();
    const state = { running: false, over: false, distance: 0, score: 0, hull: 100, speed: 20, spawn: 0, pickup: 0, fire: 0, shake: 0 };
    const ui = { status: document.querySelector('#status'), start: document.querySelector('#start'), distance: document.querySelector('#distance'), score: document.querySelector('#score'), hull: document.querySelector('#hull') };

    function box(w, h, d, color, emissive = 0x000000) {
      const material = new THREE.MeshStandardMaterial({ color, roughness: .48, metalness: .35, emissive, emissiveIntensity: emissive ? 1.4 : 0 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
    }
    function car(color, enemy = false) {
      const group = new THREE.Group();
      const body = box(2.2, .62, 3.8, color, enemy ? 0x230012 : 0x00253c); body.position.y = .65; group.add(body);
      const cabin = box(1.45, .55, 1.65, enemy ? 0x3c0714 : 0x073a5c); cabin.position.set(0, 1.12, .15); group.add(cabin);
      [-.82, .82].forEach(x => [-1.25, 1.25].forEach(z => {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .25, 12), new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: .9 }));
        wheel.rotation.z = Math.PI / 2; wheel.position.set(x, .42, z); group.add(wheel);
      }));
      if (!enemy) {
        const glow = new THREE.PointLight(0x00d9ff, 5, 9); glow.position.set(0, .8, 1.8); group.add(glow);
      }
      return group;
    }
    function roadSegment(i) {
      const group = new THREE.Group(); group.position.z = -i * segmentLength;
      const road = box(roadWidth, .3, segmentLength, 0x1d2534); road.position.y = -.22; group.add(road);
      [-roadWidth / 2 - 1.1, roadWidth / 2 + 1.1].forEach(x => {
        const rail = box(.35, .65, segmentLength, 0x00a8d6, 0x003a54); rail.position.set(x, .2, 0); group.add(rail);
      });
      [-3, 3].forEach(x => { const line = box(.12, .025, 3.2, 0x78edff, 0x00bfff); line.position.set(x, -.03, 0); group.add(line); });
      if (i % 3 === 0) {
        const sign = box(1.3, .7, .12, 0xff3d81, 0x8d123a); sign.position.set((i % 2 ? -1 : 1) * 13, 4, 0); group.add(sign);
      }
      scene.add(group); segments.push(group);
    }
    for (let i = 0; i < segmentCount; i++) roadSegment(i);

    const player = car(0x18b9ff); player.position.set(0, 0, 4); scene.add(player);
    const exhaust = new THREE.PointLight(0xff6a00, 0, 8); exhaust.position.set(0, .5, 2.1); player.add(exhaust);

    function reset() {
      enemies.splice(0).forEach(e => scene.remove(e.mesh));
      projectiles.splice(0).forEach(p => scene.remove(p.mesh));
      pickups.splice(0).forEach(p => scene.remove(p.mesh));
      state.running = true; state.over = false; state.distance = 0; state.score = 0; state.hull = 100; state.speed = 20; state.spawn = 0; state.pickup = 0; player.position.x = 0;
      ui.status.classList.add('hidden'); updateHud();
    }
    function gameOver() {
      state.running = false; state.over = true; ui.status.classList.remove('hidden');
      ui.status.querySelector('h1').textContent = 'RUN OVER';
      ui.status.querySelector('p').textContent = `You reached ${Math.floor(state.distance)}m and scored ${state.score}. Ready for another run?`;
      ui.start.textContent = 'RESTART RUN';
    }
    function updateHud() { ui.distance.textContent = Math.floor(state.distance); ui.score.textContent = state.score; ui.hull.style.width = `${Math.max(0, state.hull)}%`; }
    function spawnEnemy() {
      const mesh = car([0xff335f, 0xffa31a, 0xb35cff][Math.floor(Math.random() * 3)], true);
      mesh.position.set((Math.random() * 2 - 1) * 6.8, 0, -135); scene.add(mesh);
      enemies.push({ mesh, hp: 2, lane: mesh.position.x, speed: 8 + Math.random() * 10, hit: 0 });
    }
    function spawnPickup() {
      const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(.55), new THREE.MeshStandardMaterial({ color: 0xffe66d, emissive: 0xff8a00, emissiveIntensity: 2 }));
      mesh.position.set((Math.random() * 2 - 1) * 7, 1, -130); scene.add(mesh); pickups.push({ mesh });
    }
    function fire() {
      if (state.fire > 0) return; state.fire = .22;
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff4a3 }));
      mesh.position.copy(player.position); mesh.position.y += .8; mesh.position.z -= 2; scene.add(mesh); projectiles.push({ mesh });
    }
    function burst(position, color) {
      for (let i = 0; i < 7; i++) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(.08, 6, 6), new THREE.MeshBasicMaterial({ color }));
        mesh.position.copy(position); scene.add(mesh); particles.push({ mesh, life: .45, velocity: new THREE.Vector3((Math.random() - .5) * 8, Math.random() * 6, (Math.random() - .5) * 8) });
      }
    }
    function update(dt) {
      const steer = (keys.has('ArrowLeft') || keys.has('a') ? -1 : 0) + (keys.has('ArrowRight') || keys.has('d') ? 1 : 0);
      const boosting = keys.has(' ') || keys.has('Shift');
      state.speed += ((boosting ? 31 : 20) - state.speed) * dt * 3;
      player.position.x = THREE.MathUtils.clamp(player.position.x + steer * dt * 10, -7, 7);
      player.rotation.z = -steer * .08;
      exhaust.intensity = boosting ? 10 : 2;
      if (keys.has('x') || keys.has('k')) fire();
      state.fire = Math.max(0, state.fire - dt);
      state.distance += state.speed * dt; state.score += Math.floor(state.speed * dt * 2);
      state.spawn -= dt; state.pickup -= dt;
      if (state.spawn <= 0) { spawnEnemy(); state.spawn = Math.max(.45, 1.35 - state.distance / 5000); }
      if (state.pickup <= 0) { spawnPickup(); state.pickup = 3 + Math.random() * 3; }
      segments.forEach(segment => { segment.position.z += state.speed * dt; if (segment.position.z > 12) segment.position.z -= segmentCount * segmentLength; });
      enemies.forEach(enemy => {
        enemy.mesh.position.z += (state.speed - enemy.speed) * dt;
        enemy.mesh.position.x += (player.position.x - enemy.mesh.position.x) * dt * .12;
        enemy.mesh.rotation.y = Math.sin(state.distance * .03 + enemy.mesh.position.z) * .04;
        if (enemy.hit > 0) enemy.hit -= dt;
        if (Math.abs(enemy.mesh.position.z - player.position.z) < 2.4 && Math.abs(enemy.mesh.position.x - player.position.x) < 2.1 && enemy.hit <= 0) {
          enemy.hit = 1; state.hull -= 18; state.shake = .25; burst(enemy.mesh.position, 0xff305f);
        }
      });
      for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].mesh.position.z > 15 || enemies[i].hp <= 0) { scene.remove(enemies[i].mesh); enemies.splice(i, 1); }
      projectiles.forEach(p => { p.mesh.position.z -= 65 * dt; });
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const projectile = projectiles[i]; let destroyed = projectile.mesh.position.z < -145;
        enemies.forEach(enemy => { if (!destroyed && projectile.mesh.position.distanceTo(enemy.mesh.position) < 2) { enemy.hp--; destroyed = true; state.score += 100; burst(enemy.mesh.position, 0xffb52e); } });
        if (destroyed) { scene.remove(projectile.mesh); projectiles.splice(i, 1); }
      }
      pickups.forEach(p => { p.mesh.position.z += state.speed * dt; p.mesh.rotation.y += dt * 4; });
      for (let i = pickups.length - 1; i >= 0; i--) {
        const pickup = pickups[i];
        if (pickup.mesh.position.distanceTo(player.position) < 2.2) { state.score += 250; state.hull = Math.min(100, state.hull + 8); burst(pickup.mesh.position, 0xffe66d); scene.remove(pickup.mesh); pickups.splice(i, 1); }
        else if (pickup.mesh.position.z > 15) { scene.remove(pickup.mesh); pickups.splice(i, 1); }
      }
      particles.forEach(p => { p.life -= dt; p.mesh.position.addScaledVector(p.velocity, dt); p.velocity.y -= 9 * dt; p.mesh.material.opacity = Math.max(0, p.life * 2); p.mesh.material.transparent = true; });
      for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) { scene.remove(particles[i].mesh); particles.splice(i, 1); }
      state.shake = Math.max(0, state.shake - dt);
      camera.position.x += (player.position.x * .35 - camera.position.x) * dt * 4;
      camera.position.y = 7 + (Math.random() - .5) * state.shake;
      camera.lookAt(player.position.x * .15, .5, -24);
      updateHud(); if (state.hull <= 0) gameOver();
    }
    function render() { renderer.render(scene, camera); requestAnimationFrame(render); }
    addEventListener('keydown', e => { keys.add(e.key); if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault(); });
    addEventListener('keyup', e => keys.delete(e.key));
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    ui.start.addEventListener('click', reset);
    render();
  </script>
</body>
</html>
